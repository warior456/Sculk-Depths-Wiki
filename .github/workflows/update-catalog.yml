name: Update wiki catalogs

on:
  workflow_dispatch:
    inputs:
      mod_ref:
        description: Branch or tag of warior456/Sculk-Depths to use
        required: false
        default: portal-neoforge
  schedule:
    # Every Monday at 04:00 UTC.
    - cron: "0 4 * * 1"
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - ".github/workflows/update-catalog.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-wiki-catalogs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wiki
        uses: actions/checkout@v4

      - name: Checkout mod sources
        uses: actions/checkout@v4
        with:
          repository: warior456/Sculk-Depths
          ref: ${{ inputs.mod_ref || vars.MOD_REF || 'portal-neoforge' }}
          path: .mod-sources

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Minecraft assets (best effort)
        working-directory: .mod-sources
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew createMinecraftArtifacts --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Update catalogs
        run: python tools/catalog_tool.py --wiki-repo . --mod-repo .mod-sources

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki/feature_catalog static
          git commit -m "chore: update wiki catalogs"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger site publish
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run retype-action.yml
