name: Update wiki catalogs

on:
  workflow_dispatch:
    inputs:
      mod_ref:
        description: Branch or tag of the Sculk-Depths mod repository to use
        required: false
        default: portal-neoforge
  schedule:
    # Every Monday at 04:00 UTC.
    - cron: "0 4 * * 1"
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - ".github/workflows/update-catalog.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-wiki-catalogs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout wiki
        uses: actions/checkout@v4

      # The mod repository is public, so the default GITHUB_TOKEN can read it.
      # Override the repository/ref with repository variables MOD_REPOSITORY and
      # MOD_REF, or the mod_ref input when running the workflow manually.
      - name: Checkout mod sources
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MOD_REPOSITORY || 'warior456/Sculk-Depths' }}
          ref: ${{ inputs.mod_ref || vars.MOD_REF || 'portal-neoforge' }}
          path: .mod-sources

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle caches
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: .mod-sources

      # The preview renderer needs vanilla parent models/textures (spawn eggs,
      # fences, walls, doors, signs, cross plants). They live in the
      # client-extra jar produced by createMinecraftArtifacts.
      - name: Download Minecraft resources
        working-directory: .mod-sources
        run: |
          chmod +x gradlew
          ./gradlew createMinecraftArtifacts --no-daemon

      - name: Verify Minecraft resources
        run: |
          jar="$(find .mod-sources/build/moddev/artifacts -name '*client-extra*.jar' -print -quit)"
          if [ -z "$jar" ]; then
            echo "::error::client-extra jar missing; refusing to commit previews without vanilla models/textures."
            exit 1
          fi
          echo "Using $jar"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Update catalogs
        run: python tools/catalog_tool.py --wiki-repo . --mod-repo .mod-sources

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki/feature_catalog static
          git commit -m "chore: update wiki catalogs"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
      # Retype publish workflow is dispatched explicitly.
      - name: Trigger site publish
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run retype-action.yml
